<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script data-early-theme>(function(){try{var t=localStorage.getItem('theme');if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';}if(t==='dark'){document.documentElement.classList.add('dark-mode');}var p=localStorage.getItem('themePalette');if(p){document.documentElement.setAttribute('data-palette',p);}}catch(e){}})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>登录/注册 - 鸭鸭图床</title>
    <meta name="description" content="登录或注册鸭鸭图床，管理您的图片">
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/tokens.css">
    <link rel="stylesheet" href="./css/shell.css">
    <link rel="stylesheet" href="./css/palettes.css">
    <link rel="stylesheet" href="./css/page-auth.css">
    <link rel="icon" type="image/svg+xml" href="https://img2.nloln.de/file/BQACAgUAAyEGAASLVN5eAAJajWouI76K5xQqwB9UMxwJevLAe-rRAAIsHQAChVFwVcRunuaWzrrIPAQ.png">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="auth-page"><script data-early-theme-body>(function(){try{if(document.documentElement.classList.contains("dark-mode")){document.body.classList.add("dark-mode");}}catch(e){}})();</script>

    <div class="page-loader" id="pageLoader">
        <div class="loader-content">
            <div class="loader"><div class="loader-circle"></div></div>
            <div class="loader-brand">鸭鸭图床</div>
        </div>
    </div>

    <div class="app-container">
        <header class="header">
            <a href="/" class="logo">
                <img src="https://img2.nloln.de/file/BQACAgUAAyEGAASLVN5eAAJajWouI76K5xQqwB9UMxwJevLAe-rRAAIsHQAChVFwVcRunuaWzrrIPAQ.png" alt="鸭鸭图床" class="logo-img">
                <h1 data-i18n="page.home.title">鸭鸭图床</h1>
            </a>
            <div class="header-nav">
                <a href="/" data-i18n="common.home">首页</a>
                <label class="theme-toggle" id="themeToggle" aria-label="切换主题">
                    <input id="switch" type="checkbox">
                    <div class="theme-toggle-icon">
                        <i class="ri-sun-line"></i>
                        <i class="ri-moon-line"></i>
                    </div>
                </label>
            </div>
        </header>

        <main>
            <div class="auth-shell">
                <div class="auth-brand">
                    <img src="https://img2.nloln.de/file/BQACAgUAAyEGAASLVN5eAAJajWouI76K5xQqwB9UMxwJevLAe-rRAAIsHQAChVFwVcRunuaWzrrIPAQ.png" alt="">
                    <h1 data-i18n="auth.welcome">欢迎回来</h1>
                    <p data-i18n="auth.subtitle">登录后上传与管理图片</p>
                </div>

                <div class="auth-tabs" role="tablist">
                    <button type="button" class="auth-tab active" id="tabLogin" data-panel="loginPanel" data-i18n="auth.login">登录</button>
                    <button type="button" class="auth-tab" id="tabRegister" data-panel="registerPanel" data-i18n="auth.register">注册</button>
                </div>

                <div class="auth-card">
                    <div id="loginError" class="auth-error"></div>

                    <div class="auth-panel active" id="loginPanel">
                        <form id="loginForm" class="auth-form">
                            <div class="auth-field">
                                <label for="username" data-i18n="auth.username">用户名 / 邮箱</label>
                                <input type="text" name="username" id="username" autocomplete="username" required>
                            </div>
                            <div class="auth-field">
                                <label for="password" data-i18n="auth.password">密码</label>
                                <input type="password" name="password" id="password" autocomplete="current-password" required>
                            </div>
                            <button type="submit" class="auth-submit" data-i18n="auth.login">登录</button>
                            <a href="#" id="forgotPasswordLink" class="auth-link" data-i18n="auth.forgot">忘记密码？</a>
                        </form>
                    </div>

                    <div class="auth-panel" id="registerPanel">
                        <form id="registerForm" class="auth-form">
                            <div class="auth-field">
                                <label for="regUsername" data-i18n="auth.regUsername">用户名</label>
                                <input type="text" name="username" id="regUsername" autocomplete="username" required>
                            </div>
                            <div class="auth-field">
                                <label for="regEmail" data-i18n="auth.email">电子邮箱</label>
                                <input type="email" name="email" id="regEmail" autocomplete="email" required>
                            </div>
                            <div class="auth-field">
                                <label for="regPassword" data-i18n="auth.password">密码</label>
                                <input type="password" name="password" id="regPassword" minlength="8" maxlength="128" autocomplete="new-password" required>
                            </div>
                            <button type="submit" class="auth-submit" data-i18n="auth.register">注册</button>
                        </form>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2024-2025 鸭鸭图床 · 基于 <a href="https://telegram.org" target="_blank">Telegram</a></p>
        </footer>
    </div>

    <!-- hidden for auth.js compatibility (register/login toggle used to be a checkbox) -->
    <input type="checkbox" id="authToggle" hidden>

    <script src="./js/shell.js"></script>
    <script src="./js/theme-manager.js"></script>
    <script src="./js/user-prefs.js"></script>
    <script src="./js/palettes.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/site-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const authToggle = document.getElementById('authToggle');
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            const loginPanel = document.getElementById('loginPanel');
            const registerPanel = document.getElementById('registerPanel');

            function showPanel(which) {
                const isReg = which === 'register';
                tabLogin.classList.toggle('active', !isReg);
                tabRegister.classList.toggle('active', isReg);
                loginPanel.classList.toggle('active', !isReg);
                registerPanel.classList.toggle('active', isReg);
                if (authToggle) authToggle.checked = isReg;
            }

            tabLogin.addEventListener('click', () => showPanel('login'));
            tabRegister.addEventListener('click', () => showPanel('register'));

            const action = new URLSearchParams(window.location.search).get('action');
            if (action === 'register') showPanel('register');

            if (typeof initLoginForm === 'function') initLoginForm();
            if (typeof initRegisterForm === 'function') initRegisterForm();
            if (typeof initAuth === 'function') initAuth();
        });
    </script>
</body>
</html>
