<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script data-early-theme>(function(){try{var t=localStorage.getItem('theme');if(!t){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';}if(t==='dark'){document.documentElement.classList.add('dark-mode');}var p=localStorage.getItem('themePalette');if(p){document.documentElement.setAttribute('data-palette',p);}}catch(e){}})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f7f7f6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0c0c0e" media="(prefers-color-scheme: dark)">
    <title>内容已屏蔽 - 鸭鸭图床</title>
    <link rel="stylesheet" href="./css/tokens.css">
    <link rel="icon" type="image/svg+xml" href="https://img2.nloln.de/file/BQACAgUAAyEGAASLVN5eAAJajWouI76K5xQqwB9UMxwJevLAe-rRAAIsHQAChVFwVcRunuaWzrrIPAQ.png">

<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Noto Sans SC", system-ui, sans-serif);
            background-color: var(--bg-color, #f7f7f6);
            color: var(--text-color, #111113);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg, #ffffff);
            border-radius: var(--radius-xl, 18px);
            box-shadow: var(--shadow-sm);
            padding: 36px 32px;
            text-align: center;
            max-width: 440px;
            width: 100%;
            position: relative;
            border: 1px solid var(--border-color, rgba(17, 17, 19, 0.08));
        }

        h1 {
            color: var(--text-color, #111113);
            margin: 0 0 12px;
            font-weight: 650;
            font-size: 22px;
            letter-spacing: -0.02em;
        }

        p {
            color: var(--text-light, #52525b);
            line-height: 1.65;
            margin-bottom: 24px;
            font-size: 14.5px;
        }

        .icon-container {
            width: 56px;
            height: 56px;
            margin: 0 auto 20px;
            background: color-mix(in srgb, var(--error-color, #dc2626) 10%, transparent);
            border: 1px solid color-mix(in srgb, var(--error-color, #dc2626) 24%, transparent);
            border-radius: var(--radius-md, 10px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--error-color, #dc2626);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 0 20px;
            background: var(--primary-color, #111113);
            color: var(--text-on-primary, #ffffff);
            border: 1px solid transparent;
            border-radius: var(--radius-sm, 8px);
            font-size: 14.5px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            transition: background var(--transition-fast, 140ms ease);
        }

        @media (hover: hover) {
            .btn:hover {
                background: var(--primary-hover, #27272a);
            }
        }

        .theme-toggle {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm, 8px);
            background: var(--fill-tertiary, rgba(17, 17, 19, 0.04));
            border: 1px solid var(--border-color, rgba(17, 17, 19, 0.08));
            color: var(--text-light, #52525b);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background var(--transition-fast, 140ms ease), color var(--transition-fast, 140ms ease);
        }

        @media (hover: hover) {
            .theme-toggle:hover {
                background: var(--fill-secondary);
                color: var(--text-color);
            }
        }

        @media (max-width: 576px) {
            .container {
                padding: 28px 20px;
            }

            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body class="dark-mode-transition"><script data-early-theme-body>(function(){try{if(document.documentElement.classList.contains("dark-mode")){document.body.classList.add("dark-mode");}}catch(e){}})();</script>

            </svg>
        </button>
        <div class="icon-container" aria-hidden="true">

                <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
        </div>
        <h1>内容已被屏蔽</h1>
        <p>该图片内容不符合我们的社区准则，已被系统屏蔽。如果您认为这是一个错误，请联系管理员进行审核。</p>
        <a href="/" class="btn">返回首页</a>
    </div>

    <!-- 主题管理器 -->
    <script src="./js/theme-manager.js"></script>
    <script src="./js/palettes.js"></script>

        // 后续代码会由 theme-manager.js 处理主题切换

</body>
</html>
