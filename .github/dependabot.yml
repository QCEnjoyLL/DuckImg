# 依赖更新自动化。
#
# 为什么需要：本项目出过一次真实事故 —— 本地 node_modules 里是 hono 3.x，
# 而 package.json/lockfile 要求 4.x，`hono/body-limit` 在 3.x 不存在，
# 导致本机根本无法构建 worker，却长期无人发现。依赖漂移是这类事故的根源。

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # 分组以减少 PR 噪音：wrangler / vitest / workerd 这类工具链一起升
    groups:
      cloudflare-toolchain:
        patterns:
          - "wrangler"
          - "@cloudflare/*"
          - "miniflare"
          - "workerd"
      test-tooling:
        patterns:
          - "vitest"
          - "@vitest/*"
    # 全局忽略 major：重大版本升级可能带来破坏性变更，必须人工评估后手动升级，
    # 绝不能混在日常 PR 里被顺手合并。补上这条是因为此前只对 hono 单独设了规则，
    # 结果 vitest 5.0.0 这类 major 也会被直接提议。
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
    # GitHub Actions 同样只接受非破坏性升级（v4 → v5 会自动提 PR，
    # v4 → v7 这种跨多个 major 的由人工评估）。actions 的大版本经常伴随
    # runner 要求变化，直接合并容易让 CI 无声坏掉。
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
